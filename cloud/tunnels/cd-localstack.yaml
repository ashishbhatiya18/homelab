# Cloudflare Tunnel cd-localstack — managed by `home cloud`.
# Ingress rules use cloudflared's field names; a bare hostname takes the
# defaults ({host} = that hostname). The last rule must match everything.
# Each hostname also gets a proxied CNAME to the tunnel; it is not repeated in
# the zone file.

tunnel: cd-localstack
id: ba49b407-186d-48f3-8caa-3599fcc25a65
node: dietpi
stack: network
container: cloudflared
secret: /home/dietpi/localstack/secrets/network/cloudflared_tunnel_token
# cd's only tunnel: every route reaches Traefik over HTTP/2.
originRequest:
  http2Origin: true
defaults:
  service: https://traefik:443
  originRequest:
    httpHostHeader: '{host}'
    originServerName: '{host}'
ingress:
  - api.algokavach.ab18.in
  - api.citrusdental.in
  - api.nikview.com
  - smiledesign-be.citrusdental.in
  - service: http_status:404
