# Cloudflare Tunnel ab18-localstack — managed by `home cloud`.
# Ingress rules use cloudflared's field names; a bare hostname takes the
# defaults ({host} = that hostname). The last rule must match everything.
# Each hostname also gets a proxied CNAME to the tunnel; it is not repeated in
# the zone file.

tunnel: ab18-localstack
id: 0a2e8420-e3cb-4cb0-99c7-d36181d4e01b
node: dietpi-l
stack: network
container: cloudflared
secret: /home/dietpi/localstack/secrets/ab-cloudflared.env
defaults:
  service: https://traefik:443
  originRequest:
    httpHostHeader: '{host}'
    originServerName: '{host}'
ingress:
  - code.ab18.in
  - draw.ab18.in
  - id.ab18.in
  - pad.ab18.in
  - pdf.ab18.in
  - photos.ab18.in
  - vault.ab18.in
  - whoami.ab18.in
  - hostname: term.ab18.in
    service: https://traefik:443
    originRequest:
      http2Origin: true
      httpHostHeader: term.ab18.in
      originServerName: term.ab18.in
  - hostname: ntfy.ab18.in
    service: https://traefik:443
    originRequest:
      http2Origin: true
      httpHostHeader: ntfy.ab18.in
      originServerName: ntfy.ab18.in
  - service: http_status:404
