# Cloudflare Tunnel smile-design — managed by `home cloud`.
# Ingress rules use cloudflared's field names; a bare hostname takes the
# defaults ({host} = that hostname). The last rule must match everything.
# Each hostname also gets a proxied CNAME to the tunnel; it is not repeated in
# the zone file.

tunnel: smile-design
id: 6229510c-45d9-47e1-b874-5e3ca554fa2d
node: dietpi
stack: smiledesign
container: smiledesign-cloudflare
secret: /home/dietpi/localstack/secrets/smiledesign_cloudflare_tunnel_token
ingress:
  - hostname: smiledesign-be.citrusdental.in
    service: https://traefik:443
    originRequest:
      http2Origin: true
      httpHostHeader: smiledesign-be.citrusdental.in
      originServerName: smiledesign-be.citrusdental.in
  - service: http_status:404
