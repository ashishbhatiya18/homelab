# Cloudflare Tunnel nikview.com — managed by `home cloud`.
# Ingress rules use cloudflared's field names; a bare hostname takes the
# defaults ({host} = that hostname). The last rule must match everything.
# Each hostname also gets a proxied CNAME to the tunnel; it is not repeated in
# the zone file.

tunnel: nikview.com
id: 6a318c45-5c6c-4aaf-897e-4d3b269d69c5
node: dietpi
stack: nikview
container: nikview-cloudflare
secret: /home/dietpi/localstack/secrets/nikview/cloudflare_tunnel_token
ingress:
  # Nikview API (nodes/cd/nikview), called by the web app at nikview.com.
  - hostname: api.nikview.com
    service: http://nikview:8080
  - service: http_status:404
