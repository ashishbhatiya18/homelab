# Builds nodes/ab/claudecode into ghcr.io/ashishbhatiya18/claudecode so the gitops
# agent on node ab only pulls (no image builds on the node).
name: Build claudecode

on:
  push:
    branches: [main]
    paths:
      - nodes/ab/claudecode/**
      - "!nodes/ab/claudecode/compose.yaml"
      - .github/workflows/build-claudecode.yml
  workflow_dispatch:

env:
  IMAGE: ghcr.io/ashishbhatiya18/claudecode

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: nodes/ab/claudecode
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=claudecode
          cache-to: type=gha,mode=max,scope=claudecode
