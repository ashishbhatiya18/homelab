# home-cli: test on every change. On a home-cli-vX.Y.Z tag: build the macOS
# binaries, publish them as the package ghcr.io/ashishbhatiya18/home-cli
# (:X.Y.Z and :latest, one archive per architecture), and rewrite
# Formula/home.rb in ashishbhatiya18/homebrew-tap to download them from GHCR
# by digest — the way Homebrew fetches its own bottles (`brew install
# ashishbhatiya18/tap/home` is unchanged for users).
#
# Pushing to the tap uses a deploy key that can write to that one repository
# only: the private half is the TAP_DEPLOY_KEY secret of this repository, the
# public half is a read-write deploy key on homebrew-tap.
#
# Every release step is idempotent, so it can be re-run by hand for an
# existing tag (Actions → home-cli → Run workflow).
name: home-cli

on:
  push:
    branches: [main]
    tags: ["home-cli-v*"]
    paths:
      - home-cli/**
      - .github/workflows/home-cli.yml
  pull_request:
    paths:
      - home-cli/**
      - .github/workflows/home-cli.yml
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. home-cli-v0.3.2)"
        required: true

jobs:
  test:
    # macOS: home shells out to osascript/security and its tests expect it.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: home-cli
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: home-cli/go.mod
          cache-dependency-path: home-cli/go.sum
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o home ./cmd/home && ./home version

  release:
    needs: test
    if: startsWith(inputs.tag || github.ref_name, 'home-cli-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      PACKAGE: ghcr.io/ashishbhatiya18/home-cli
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: home-cli/go.mod
          cache-dependency-path: home-cli/go.sum

      - name: Build macOS binaries
        working-directory: home-cli
        run: |
          set -euo pipefail
          VERSION="${TAG#home-cli-v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p ../dist
          for arch in arm64 amd64; do
            CGO_ENABLED=0 GOOS=darwin GOARCH=$arch \
              go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "build/$arch/home" ./cmd/home
            tar -C "build/$arch" -czf "../dist/home_darwin_$arch.tar.gz" home
          done
          cd ../dist && shasum -a 256 *.tar.gz > checksums.txt && cat checksums.txt

      - uses: oras-project/setup-oras@v1

      - name: Publish the package
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd dist
          # Each archive becomes a blob whose digest is its sha256, so the
          # formula can fetch it directly by digest.
          oras push "$PACKAGE:$VERSION,latest" \
            --artifact-type application/vnd.ashishbhatiya18.home-cli \
            --annotation "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --annotation "org.opencontainers.image.version=$VERSION" \
            --annotation "org.opencontainers.image.revision=$(git rev-parse HEAD)" \
            home_darwin_arm64.tar.gz:application/gzip \
            home_darwin_amd64.tar.gz:application/gzip

      - name: Update formula in the tap
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/tap_key && chmod 600 ~/.ssh/tap_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone git@github.com:ashishbhatiya18/homebrew-tap.git tap

          base="https://ghcr.io/v2/ashishbhatiya18/home-cli/blobs/sha256:"
          sha() { awk -v f="home_darwin_$1.tar.gz" '$2 == f { print $1 }' dist/checksums.txt; }
          cat > tap/Formula/home.rb <<RUBY
          class Home < Formula
            desc "Run your homelab from your Mac: nodes, stacks, upgrades and encrypted backups"
            homepage "https://github.com/${GITHUB_REPOSITORY}/tree/main/home-cli"
            version "${VERSION}"
            license "MIT"

            on_arm do
              url "${base}$(sha arm64)"
              sha256 "$(sha arm64)"
            end
            on_intel do
              url "${base}$(sha amd64)"
              sha256 "$(sha amd64)"
            end

            depends_on "libpq" # pg_restore/psql/pg_dump for backup validation and restores

            def install
              bin.install "home"
            end

            def caveats
              <<~EOS
                Run \`home\` to set up your nodes and \`home br setup\` for backups, then
                \`home install\` to start the background jobs, one brew service each:
                home-backup, home-check, home-cleanup, home-deploy (see \`home jobs\`).
                Coming from hbr? \`home br\` picks up your hbr settings automatically.
              EOS
            end

            test do
              assert_match "home", shell_output("#{bin}/home version")
            end
          end
          RUBY

          # Homebrew allows one service per formula, so each background job is
          # a companion formula whose service runs `home jobs run <job> --if-due`.
          # They reuse the home archive (downloaded once) and install a launcher.
          job() { # job <name> <interval seconds> <description>
            local cls
            cls="Home$(tr '[:lower:]' '[:upper:]' <<< "${1:0:1}")${1:1}"
            cat > "tap/Formula/home-$1.rb" <<RUBY
          class ${cls} < Formula
            desc "home background job: $3"
            homepage "https://github.com/${GITHUB_REPOSITORY}/tree/main/home-cli"
            version "${VERSION}"
            license "MIT"

            on_arm do
              url "${base}$(sha arm64)"
              sha256 "$(sha arm64)"
            end
            on_intel do
              url "${base}$(sha amd64)"
              sha256 "$(sha amd64)"
            end

            depends_on "ashishbhatiya18/tap/home"

            def install
              (libexec/"home-$1").write <<~SH
                #!/bin/sh
                exec "#{HOMEBREW_PREFIX}/bin/home" jobs run $1 --if-due
              SH
              (libexec/"home-$1").chmod 0755
            end

            # Started by \`home install\` (or \`brew services start home-$1\`).
            service do
              run [opt_libexec/"home-$1"]
              run_type :interval
              interval $2
              environment_variables PATH: "#{HOMEBREW_PREFIX}/bin:#{HOMEBREW_PREFIX}/opt/libpq/bin:/usr/bin:/bin:/usr/sbin:/sbin"
              log_path var/"log/home-$1.log"
              error_log_path var/"log/home-$1.log"
            end

            test do
              assert_predicate libexec/"home-$1", :executable?
            end
          end
          RUBY
          }
          job backup 900 "encrypted backups (home br) when due"
          job check 900 "daily node and update check with a notification"
          job cleanup 3600 "daily pruning of unused images and caches on every node"
          job deploy 300 "deploys new node bundles with health checks and rollback"

          cd tap
          if [ -z "$(git status --porcelain)" ]; then
            echo "Formula already points at ${TAG}; nothing to do."
            exit 0
          fi
          git config user.name "home release bot"
          git config user.email "actions@users.noreply.github.com"
          git add Formula
          git commit -m "home ${VERSION}"
          git push
