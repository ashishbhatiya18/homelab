# On a version tag (v1.2.3): test, create the GitHub release, and point the
# Homebrew formula in ashishbhatiya18/homebrew-tap at the new tag.
#
# Pushing to the tap uses a deploy key that can write to that one repository
# only: the private half is the TAP_DEPLOY_KEY secret of this repository, the
# public half is a read-write deploy key on homebrew-tap.
#
# Every step is idempotent, so it can also be re-run by hand for an existing
# tag (Actions → release → Run workflow).
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v0.1.1)"
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test ./...

      - name: Create GitHub release (if missing)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes --verify-tag

      - name: Update formula in the tap
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/tap_key && chmod 600 ~/.ssh/tap_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone git@github.com:ashishbhatiya18/homebrew-tap.git tap

          url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG}.tar.gz"
          sha=$(curl -fsSL "$url" | sha256sum | cut -d' ' -f1)
          cd tap
          sed -i -E "s#^  url \".*\"#  url \"${url}\"#; s#^  sha256 \".*\"#  sha256 \"${sha}\"#" Formula/hbr.rb
          if git diff --quiet; then
            echo "Formula already points at ${TAG}; nothing to do."
            exit 0
          fi
          git config user.name "hbr release bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -am "hbr ${TAG}"
          git push
