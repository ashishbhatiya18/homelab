# On a version tag (v1.2.3), update the Homebrew formula in
# ashishbhatiya18/homebrew-tap to build the new tag from source.
#
# Needs one repository secret, TAP_GITHUB_TOKEN: a fine-grained token with
# "Contents: Read and write" on the homebrew-tap repository only.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  tap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test ./...
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
      - name: Update formula in the tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          sha=$(curl -fsSL "$url" | sha256sum | cut -d' ' -f1)
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/ashishbhatiya18/homebrew-tap.git" tap
          cd tap
          sed -i -E "s#^  url \".*\"#  url \"${url}\"#; s#^  sha256 \".*\"#  sha256 \"${sha}\"#" Formula/hbr.rb
          git config user.name "hbr release bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -am "hbr ${GITHUB_REF_NAME}"
          git push
