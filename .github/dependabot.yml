version: 2
# Logged-in registry access for the image checks: anonymous ones get rate
# limited (429) on Docker Hub and ghcr.io. Read-only tokens, stored as
# Dependabot secrets in the repo settings.
registries:
  dockerhub:
    type: docker-registry
    url: registry.hub.docker.com
    username: ab18
    password: ${{secrets.DOCKERHUB_TOKEN}}
  ghcr:
    type: docker-registry
    url: ghcr.io
    username: ashishbhatiya18
    password: ${{secrets.GHCR_TOKEN}}

updates:
  - package-ecosystem: gomod
    directory: /home-cli
    schedule:
      interval: weekly
    groups:
      home-cli-go:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /down-cli
    schedule:
      interval: weekly
    groups:
      down-cli-go:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      all-actions:
        patterns: ["*"]

  # Third-party images, pinned tag@sha256 in every stack: daily PRs for new
  # versions and digests (Gatus reminds every 12h while any are open). Floating
  # tags without a digest are left alone by Dependabot.
  - package-ecosystem: docker-compose
    directories: ["/nodes/*/*"]
    registries: [dockerhub, ghcr]
    schedule:
      interval: daily
    ignore:
      # Own images: built by their repos' CI, updated with `home stack update`.
      # Dependabot names images without the registry host.
      - dependency-name: "ashishbhatiya18/*"
      # Immich's Postgres follows Immich's release notes, not semver.
      - dependency-name: "immich-app/postgres"
      # Immich's images have thousands of per-commit tags: listing them took 11
      # of the run's 13 minutes and got rate limited. immich-bump.yml opens the
      # PR from Immich's GitHub releases instead.
      - dependency-name: "immich-app/immich-*"
    groups:
      # Every other image: one PR per image, bumping it in all the stacks
      # that use it (cloudflared in four, Traefik and Tailscale in two).
      images:
        group-by: dependency-name
        patterns: ["*"]
