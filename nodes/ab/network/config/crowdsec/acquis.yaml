# Logs CrowdSec reads: each container's stdout, through socket-proxy's
# read-only Docker API (new lines only, from when CrowdSec starts).
source: docker
container_name: [traefik]
docker_host: tcp://socket-proxy:2375
labels:
  type: traefik
---
source: docker
container_name: [authelia]
docker_host: tcp://socket-proxy:2375
labels:
  type: authelia
---
source: docker
container_name: [vaultwarden]
docker_host: tcp://socket-proxy:2375
labels:
  type: vaultwarden
