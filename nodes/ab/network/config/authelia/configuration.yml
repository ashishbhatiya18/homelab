# Authelia — passkey login, Traefik forward auth (middleware `auth-oidc`) and
# the OpenID Connect provider at https://id.ab18.in. Runs alongside
# webauthn-proxy while it is being trialled.
#
# No secrets here: they are files in /home/dietpi/localstack/secrets/authelia/
# (mounted at /secrets), read through AUTHELIA_*_FILE env vars or the
# `secret` template function (X_AUTHELIA_CONFIG_FILTERS=template).
# State (SQLite, notifications) is in /home/dietpi/localstack/data/authelia/.

theme: auto

server:
  address: tcp://:9091
  endpoints:
    authz:
      forward-auth:
        implementation: ForwardAuth

log:
  level: info

totp:
  disable: true

webauthn:
  display_name: ab18
  enable_passkey_login: true
  selection_criteria:
    discoverability: required
    user_verification: required

authentication_backend:
  password_reset:
    disable: true
  file:
    path: /secrets/users.yml
    watch: true

access_control:
  default_policy: deny
  rules:
    # Authelia only offers credential registration (passkeys included) when
    # some rule needs a second factor; this test path is that rule.
    - domain: whoami.ab18.in
      resources: ['^/2fa([/?].*)?$']
      policy: two_factor
    # A passkey is a single factor; everything behind auth-oidc accepts it.
    - domain: '*.ab18.in'
      policy: one_factor

session:
  name: authelia_session
  cookies:
    - domain: ab18.in
      authelia_url: https://id.ab18.in
      inactivity: 1d
      expiration: 30d
      remember_me: 90d

regulation:
  max_retries: 5
  find_time: 10m
  ban_time: 30m

storage:
  local:
    path: /data/db.sqlite3

notifier:
  # No SMTP: one-time codes (e.g. to register a passkey) land in this file.
  filesystem:
    filename: /data/notification.txt

identity_providers:
  oidc:
    jwks:
      - key_id: main
        algorithm: RS256
        use: sig
        key: {{ secret "/secrets/oidc_jwks.pem" | mindent 10 "|" | msquote }}
    clients:
      # Throwaway client for testing the authorization code flow end to end:
      # whoami echoes the callback, the code is exchanged with curl.
      - client_id: oidc-test
        client_name: OIDC test
        client_secret: {{ secret "/secrets/oidc-test.digest" | msquote }}
        public: false
        authorization_policy: one_factor
        require_pkce: false
        redirect_uris:
          - https://whoami.ab18.in/oidc/callback
        scopes: [openid, profile, email, groups]
        response_types: [code]
        grant_types: [authorization_code]
        token_endpoint_auth_method: client_secret_basic
      - client_id: immich
        client_name: Immich
        client_secret: {{ secret "/secrets/immich.digest" | msquote }}
        public: false
        authorization_policy: one_factor
        consent_mode: pre-configured
        pre_configured_consent_duration: 1y
        require_pkce: true
        pkce_challenge_method: S256
        redirect_uris:
          - https://photos.ab18.in/auth/login
          - https://photos.ab18.in/user-settings
          - app.immich:///oauth-callback
        scopes: [openid, profile, email]
        response_types: [code]
        grant_types: [authorization_code]
        access_token_signed_response_alg: none
        userinfo_signed_response_alg: none
        token_endpoint_auth_method: client_secret_basic
