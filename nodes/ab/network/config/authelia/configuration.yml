# Authelia — passkey login, Traefik forward auth (the `auth` middleware every
# protected router uses) and the OpenID Connect provider at https://id.ab18.in.
# Users (users.yml) and OIDC clients (clients.yml) are node files managed with
# `home auth`.
#
# No secrets here: they are files in /home/dietpi/localstack/secrets/network/authelia/
# (mounted at /secrets), read through AUTHELIA_*_FILE env vars or the
# `secret` template function (X_AUTHELIA_CONFIG_FILTERS=template).
# State (SQLite, notifications) is in /home/dietpi/localstack/data/authelia/.

# Branding: the ab18.in logo (assets/logo.png, favicon.ico, rendered from the
# site's icon.svg); dark like the site. assets/locales/en/{portal,settings}.json
# are full copies of 4.39's English strings with ab18 in the tab titles.
# Authelia refuses to start if a value drops a key's "authelia" placeholder
# (tab titles, "Powered by" footer, privacy notice); refresh them from
# https://id.ab18.in/locales/en/<ns>.json when upgrading.
theme: dark

server:
  address: tcp://:9091
  asset_path: /config/assets/
  endpoints:
    authz:
      forward-auth:
        implementation: ForwardAuth

log:
  level: info

totp:
  disable: true

webauthn:
  display_name: ab18
  enable_passkey_login: true
  # A passkey whose device verified the user (biometric/PIN; required below)
  # counts as two factors, so two_factor rules and sensitive account actions
  # don't fall back to the password. The password only bootstraps a new user.
  experimental_enable_passkey_uv_two_factors: true
  selection_criteria:
    discoverability: required
    user_verification: required

authentication_backend:
  password_reset:
    disable: true
  file:
    path: /secrets/users.yml
    watch: true

access_control:
  default_policy: deny
  rules:
    # Authelia only offers credential registration (passkeys included) when
    # some rule needs a second factor; this test path is that rule.
    - domain: whoami.ab18.in
      resources: ['^/2fa([/?].*)?$']
      policy: two_factor
    # A passkey is a single factor; everything behind `auth` accepts it.
    - domain: '*.ab18.in'
      policy: one_factor

session:
  name: ab18_session
  cookies:
    - domain: ab18.in
      authelia_url: https://id.ab18.in
      inactivity: 1d
      expiration: 30d
      remember_me: 90d

regulation:
  max_retries: 5
  find_time: 10m
  ban_time: 30m

storage:
  local:
    path: /data/db.sqlite3

notifier:
  # No SMTP: one-time codes (e.g. to register a passkey) land in this file.
  filesystem:
    filename: /data/notification.txt

identity_providers:
  oidc:
    jwks:
      - key_id: main
        algorithm: RS256
        use: sig
        key: {{ secret "/secrets/oidc_jwks.pem" | mindent 10 "|" | msquote }}
    # Clients are in clients.yml next to users.yml on the node (a second
    # configuration file, see X_AUTHELIA_CONFIG), managed with `home auth client`.
