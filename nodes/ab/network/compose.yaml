services:
  traefik:
    image: traefik:latest
    container_name: traefik
    restart: always
    networks:
      - network-layer
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config/traefik/traefik.yml:/etc/traefik/traefik.yml
      - ./config/traefik/traefik_dynamic.yml:/etc/traefik/traefik_dynamic.yaml
      - /home/dietpi/localstack/data/traefik/acme.json:/etc/acme/acme.json
    environment:
      - CF_DNS_API_TOKEN_FILE=/run/secrets/cf_dns_api_token
    labels:
      - traefik.enable=true
      - traefik.http.routers.proxy.rule=Host(`proxy.ab18.in`)
      - traefik.http.routers.proxy.service=api@internal
      - com.centurylinklabs.watchtower.enable=false
    secrets:
      - cf_dns_api_token
  whoami:
    image: traefik/whoami
    container_name: whoami
    restart: always
    networks:
      - network-layer
    labels:
      - traefik.enable=true
      - traefik.http.routers.whoami.rule=Host(`whoami.ab18.in`)
      - traefik.http.routers.whoami.middlewares=auth-oidc
    depends_on:
      - traefik
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    hostname: ab-node
    restart: always
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    volumes:
      - tailscale_state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    entrypoint: ["/bin/sh", "-c", "export TS_AUTHKEY=$(cat /run/secrets/ts_auth_key) && exec /usr/local/bin/containerboot"]
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_ACCEPT_DNS=false
      - TS_AUTH_ONCE=true
      # No SNAT for traffic forwarded from tailscale0: it is DNAT'd into Docker
      # (Traefik) and would otherwise reach it from the bridge gateway instead
      # of the client's Tailscale IP. ab advertises no subnet routes. Also set
      # in the state volume (`tailscale set --snat-subnet-routes=false`).
      - TS_EXTRA_ARGS=--snat-subnet-routes=false
    secrets:
      - ts_auth_key
    labels:
      - com.centurylinklabs.watchtower.enable=false

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: always
    command: tunnel --no-autoupdate run
    env_file: /home/dietpi/localstack/secrets/ab-cloudflared.env
    networks:
      network-layer:
        # Fixed so Traefik can trust exactly this hop's X-Forwarded-For
        # (the real client IP from Cloudflare); see traefik.yml.
        ipv4_address: 11.11.11.250
    labels:
      - com.centurylinklabs.watchtower.enable=false
  webauthn-proxy:
    image: ghcr.io/ashishbhatiya18/webauthn-proxy:latest
    container_name: webauthn-proxy
    restart: always
    networks:
      - network-layer
    user: "65532:65532"
    volumes:
      - /home/dietpi/localstack/data/webauthn-proxy:/data
    env_file: /home/dietpi/localstack/secrets/webauthn-proxy.env
    labels:
      - traefik.enable=true
      - traefik.http.routers.auth.rule=(Host(`auth.ab18.in`) || PathPrefix(`/_webauthn`))
      - traefik.http.routers.auth.middlewares=auth-headers
      - traefik.http.middlewares.auth-headers.headers.stsSeconds=315360000
      - traefik.http.middlewares.auth-headers.headers.browserXssFilter=true
      - traefik.http.middlewares.auth-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.auth-headers.headers.forceSTSHeader=true
      - traefik.http.middlewares.auth-headers.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.auth-headers.headers.stsPreload=true
      - traefik.http.middlewares.auth-headers.headers.frameDeny=true
      - traefik.http.middlewares.auth.forwardauth.address=http://webauthn-proxy:4180/_webauthn/auth
      - traefik.http.middlewares.auth.forwardAuth.authResponseHeaders=X-Webauthn-User
      - traefik.http.middlewares.auth.forwardAuth.maxResponseBodySize=10485760
      - traefik.http.middlewares.auth.forwardAuth.trustForwardHeader=true

  # Authelia: passkey login, forward auth (middleware auth-oidc) and the OIDC
  # provider for Immich, on trial alongside webauthn-proxy. Secrets are seeded
  # by scripts/authelia-secrets.sh.
  authelia:
    image: authelia/authelia:4.39
    container_name: authelia
    restart: always
    # dietpi, which owns secrets/authelia and data/authelia; never root.
    user: "1000:1000"
    networks:
      - network-layer
    volumes:
      - ./config/authelia/configuration.yml:/config/configuration.yml:ro
      - /home/dietpi/localstack/secrets/authelia:/secrets:ro
      - /home/dietpi/localstack/data/authelia:/data
    environment:
      - X_AUTHELIA_CONFIG_FILTERS=template
      - AUTHELIA_SESSION_SECRET_FILE=/secrets/session_secret
      - AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE=/secrets/storage_encryption_key
      - AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE=/secrets/jwt_secret
      - AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET_FILE=/secrets/oidc_hmac_secret
    labels:
      - traefik.enable=true
      - traefik.http.routers.authelia.rule=Host(`id.ab18.in`)
      - traefik.http.routers.authelia.middlewares=auth-headers
      - traefik.http.services.authelia.loadbalancer.server.port=9091
      - traefik.http.middlewares.auth-oidc.forwardAuth.address=http://authelia:9091/api/authz/forward-auth
      - traefik.http.middlewares.auth-oidc.forwardAuth.trustForwardHeader=true
      - traefik.http.middlewares.auth-oidc.forwardAuth.authResponseHeaders=Remote-User,Remote-Groups,Remote-Email,Remote-Name

  # oauth2-proxy (kept for reference, disabled until webauthn-proxy is stable)
  # oauth2-proxy:
  #   image: bitnami/oauth2-proxy:latest
  #   container_name: oauth2-proxy
  #   restart: always
  #   networks:
  #     - network-layer
  #   volumes:
  #     - /home/dietpi/localstack/secrets/oauth2-proxy/config.toml:/etc/oauth2-proxy.cfg:ro
  #     - ./config/oauth2-proxy/emails.txt:/etc/emails.txt:ro
  #   command:
  #     - --config=/etc/oauth2-proxy.cfg
  #     - --authenticated-emails-file=/etc/emails.txt
  #     - --set-xauthrequest=true
  #   dns:
  #     - 1.1.1.1
  #   labels:
  #     - traefik.enable=true
  #     - traefik.http.routers.auth.rule=(Host(`auth.ab18.in`) || PathPrefix(`/oauth2`))
  #     - traefik.http.routers.auth.middlewares=auth-headers
  #     - traefik.http.middlewares.auth-headers.headers.stsSeconds=315360000
  #     - traefik.http.middlewares.auth-headers.headers.browserXssFilter=true
  #     - traefik.http.middlewares.auth-headers.headers.contentTypeNosniff=true
  #     - traefik.http.middlewares.auth-headers.headers.forceSTSHeader=true
  #     - traefik.http.middlewares.auth-headers.headers.stsIncludeSubdomains=true
  #     - traefik.http.middlewares.auth-headers.headers.stsPreload=true
  #     - traefik.http.middlewares.auth-headers.headers.frameDeny=true
  #     - traefik.http.middlewares.auth.forwardauth.address=http://oauth2-proxy:4180
  #     - traefik.http.middlewares.auth.forwardAuth.authResponseHeaders=X-Auth-Request-User,X-Auth-Request-Access-Token,Authorization
  #     - traefik.http.middlewares.auth.forwardAuth.maxResponseBodySize=10485760

volumes:
  tailscale_state:

networks:
  network-layer:
    name: internal_bridge
    external: true

secrets:
  cf_dns_api_token:
    file: /home/dietpi/localstack/secrets/cf_dns_api_token
  ts_auth_key:
    file: /home/dietpi/localstack/secrets/ts_auth_key
