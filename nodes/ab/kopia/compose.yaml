services:
  kopia:
    # Built by .github/workflows/build-kopia.yml from this directory.
    image: ghcr.io/ashishbhatiya18/kopia:latest
    container_name: kopia
    # Snapshot source identity (root@ab:/data-ab); entrypoint.sh pins it.
    hostname: ab
    restart: always
    command:
      - server
      - start
      - --disable-csrf-token-checks
      - --insecure
      - --address=0.0.0.0:51515
      - --without-password
      - --allow-extremely-dangerous-unauthenticated-server-on-the-network
      - --enable-actions
    volumes:
      - /home/dietpi/localstack/data/kopia/config:/app/config
      - /home/dietpi/localstack/data/kopia/cache:/app/cache
      - /home/dietpi/localstack/data/kopia/rclone:/app/rclone
      - /home/dietpi/localstack:/data-ab
      - ./scripts/pre-snapshot.sh:/scripts/pre-snapshot.sh:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.kopia.rule=Host(`backup.ab18.in`)
      - traefik.http.services.kopia.loadbalancer.server.port=51515
      - traefik.http.routers.kopia.middlewares=auth
    networks:
      - network-layer
    environment:
      - KOPIA_CONFIG_PATH=/app/config/repository.config
      - KOPIA_CACHE_DIRECTORY=/app/cache
      - RCLONE_CONFIG=/app/rclone/rclone.conf
      - KOPIA_RCLONE_PATH=cd:/home/dietpi/backup
      # Secrets are files (docs/secrets.md); entrypoint.sh and
      # scripts/pre-snapshot.sh read them.
      - KOPIA_PASSWORD_FILE=/run/secrets/repository_password
      - PG_PASSWORD_FILE=/run/secrets/postgres_password
    secrets:
      - repository_password
      - postgres_password

networks:
  network-layer:
    name: internal_bridge
    external: true
secrets:
  repository_password:
    file: /home/dietpi/localstack/secrets/kopia/repository_password
  postgres_password:
    file: /home/dietpi/localstack/secrets/kopia/postgres_password
