services:
  syncthing:
    # Official image as dietpi; init/start.sh seeds config.xml and copies the
    # device identity from secrets/, then runs the image's entrypoint.
    image: syncthing/syncthing:2.1.7@sha256:2b71da7c0d0a91a6ae5285ad079226fecc0a365d08b27720e1f7037b018f7546
    container_name: syncthing
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    entrypoint: ["/start.sh"]
    hostname: sync.ab18.in
    networks:
      - network-layer
    restart: always
    environment:
      TZ: Asia/Kolkata
      STHOMEDIR: /config
      STGUIADDRESS: 0.0.0.0:8384
    volumes:
      - /home/dietpi/localstack/data/syncthing:/config
      - ./config.xml.template:/seed/config.xml:ro
      - /home/dietpi/localstack/secrets/syncthing:/secrets:ro
      - ./init/start.sh:/start.sh:ro
      - /home/dietpi/music:/music
      - /home/dietpi/movies:/movies
    labels:
      - traefik.enable=true
      - traefik.http.routers.syncthing.rule=Host(`sync.ab18.in`)
      - traefik.http.services.syncthing.loadbalancer.server.port=8384
      - traefik.tcp.routers.syncthing.rule=HostSNI(`sync.ab18.in`)
      - traefik.tcp.routers.syncthing.entrypoints=websecure
      - traefik.tcp.routers.syncthing.tls=true
      - traefik.tcp.services.syncthing_tcp.loadbalancer.server.port=22000
#      - traefik.http.routers.syncthing.middlewares=auth
networks:
  network-layer:
    name: internal_bridge
    external: true