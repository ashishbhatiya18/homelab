services:
  postgresql:
    # Postgres 18 (moved from 14 by dump and restore, 2026-11-14; data/pg_data
    # holds the 14 cluster as a rollback). Major upgrades are by hand:
    # Dependabot ignores this image.
    image: ghcr.io/immich-app/postgres:18-vectorchord0.5.3@sha256:828081a755d3911a2d94f0a2be9f98570c07d52cf080fd310a9d6e4b83b73aa5
    container_name: postgres
    # Root only to start: the entrypoint reads the dietpi-owned secret, fixes
    # ownership and drops to the database user. Just what that needs.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    hostname: postgres
    restart: always
    volumes:
      # 18+ keeps its cluster in /var/lib/postgresql/18/docker.
      - /home/dietpi/localstack/data/pg_data18:/var/lib/postgresql
    # The password only matters when the data directory is first initialized.
    environment:
      DB_USERNAME: immich
      DB_DATABASE_NAME: photos
      POSTGRES_INITDB_ARGS: --data-checksums
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    networks:
      - data-layer
      - network-layer
    labels:
      - traefik.enable=true
      - traefik.tcp.routers.pg.rule=HostSNI(`pg.ab18.in`)
      - traefik.tcp.routers.pg.tls.options=db@file
      - traefik.tcp.routers.pg.entrypoints=websecure
      - traefik.tcp.routers.pg.tls=true
      - traefik.tcp.routers.pg.tls.certresolver=myresolver
    shm_size: 128mb
  redis:
    image: redis:alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
    container_name: redis
    # Root only to start: the entrypoint reads the dietpi-owned secret, fixes
    # ownership and drops to the database user. Just what that needs.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    restart: always
    # The config secret holds `requirepass <password>`, so the password is in
    # neither the command line nor the environment. Immich (redis:6379 on
    # internal_bridge) has the same password in secrets/immich/redis_password.
    command: ["redis-server", "/run/secrets/redis_conf"]
    secrets:
      - redis_conf
    networks:
      - data-layer
      - network-layer
    volumes:
      - /home/dietpi/localstack/data/redis_data:/data
networks:
  data-layer:
    external: true
  network-layer:
    name: internal_bridge
    external: true
secrets:
  postgres_password:
    file: /home/dietpi/localstack/secrets/data/postgres_password
  redis_conf:
    file: /home/dietpi/localstack/secrets/data/redis.conf
