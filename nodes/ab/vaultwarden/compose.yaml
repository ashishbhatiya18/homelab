services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: always
    # dietpi, which owns data/vaultwarden_data and config/config.json; never root.
    user: "1000:1000"
    volumes:
      - /home/dietpi/localstack/data/vaultwarden_data:/data
      - ./config/config.json:/data/config.json
    expose:
      - "3012"
    networks:
      - network-layer
    # Secrets are files (docs/secrets.md): Vaultwarden reads any setting X from
    # the file X_FILE names. The rest is configuration, here and in config.json.
    environment:
      TZ: Asia/Kolkata
      WEBSOCKET_ENABLED: "true"
      SESSION_LIFETIME_SECONDS: "2592000"
      # Sign-in through Authelia (OIDC client `vaultwarden`, see `home auth client`).
      SSO_CLIENT_ID: vaultwarden
      ADMIN_TOKEN_FILE: /run/secrets/admin_token
      DATABASE_URL_FILE: /run/secrets/database_url
      SSO_CLIENT_SECRET_FILE: /run/secrets/sso_client_secret
    secrets:
      - admin_token
      - database_url
      - sso_client_secret
    # Postgres and Authelia over the LAN, not through the Cloudflare tunnel.
    extra_hosts:
      - pg.ab18.in=10.10.10.11
      - id.ab18.in=10.10.10.11
    labels:
      - traefik.enable=true
      - traefik.http.routers.vault.rule=Host(`vault.ab18.in`)
      - traefik.http.routers.vault.middlewares=vault-headers
      - traefik.http.routers.vault.service=vault
      - traefik.http.services.vault.loadbalancer.server.port=80
      - traefik.http.middlewares.vault-headers.headers.customrequestheaders.X-Forwarded-Proto=https
      - traefik.http.routers.vault-ws.rule=Host(`vault.ab18.in`) && Path(`/notifications/hub`)
      - traefik.http.routers.vault-ws.middlewares=vault-headers
      - traefik.http.routers.vault-ws.service=vault-ws
      - traefik.http.services.vault-ws.loadbalancer.server.port=3012
      #- traefik.http.routers.vault.middlewares=auth
networks:
  network-layer:
    name: internal_bridge
    external: true
secrets:
  admin_token:
    file: /home/dietpi/localstack/secrets/vaultwarden/admin_token
  database_url:
    file: /home/dietpi/localstack/secrets/vaultwarden/database_url
  sso_client_secret:
    file: /home/dietpi/localstack/secrets/vaultwarden/authelia_client_secret
