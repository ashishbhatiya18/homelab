# Configuration both containers get; secrets are only the server's (docs/secrets.md).
x-immich-env: &immich-env
  UPLOAD_LOCATION: /home/dietpi/photos
  REVERSE_GEOCODING_PRECISION: "3"
  IMMICH_MACHINE_LEARNING_URL: http://immich-machine-learning:3003
  IMMICH_VERSION: release
  IMMICH_METRICS: "true"

services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    container_name: immich-server
    # Rootless, as in Immich's docker-compose.rootless.yml: dietpi (1000:1000)
    # owns immich_data and immich_model on cd's NFS exports.
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
    volumes:
      - nfs-data:/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      - network-layer
      - default
    environment:
      <<: *immich-env
      DB_URL_FILE: /run/secrets/db_url
      REDIS_HOSTNAME: redis
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
    secrets:
      - db_url
      - redis_password
    labels:
      - traefik.enable=true
      - traefik.http.routers.immich.rule=Host(`photos.ab18.in`)
      - traefik.http.services.immich.loadbalancer.server.port=2283
      - traefik.http.routers.immich.middlewares=immich-ratelimit,immich-cors
      - traefik.http.middlewares.immich-ratelimit.ratelimit.average=2000
      - traefik.http.middlewares.immich-ratelimit.ratelimit.burst=1200
      - traefik.http.middlewares.immich-ratelimit.ratelimit.period=1m
      - "traefik.http.middlewares.immich-cors.headers.accesscontrolalloworiginlist=http://localhost:3000,https://ab18.in,https://photos.ab18.in"
      - "traefik.http.middlewares.immich-cors.headers.accesscontrolallowmethods=GET,HEAD,OPTIONS"
      - "traefik.http.middlewares.immich-cors.headers.accesscontrolallowheaders=Accept,Content-Type,Authorization"
      - "traefik.http.middlewares.immich-cors.headers.accesscontrolmaxage=3600"
    restart: always
    dns:
      - 10.10.10.10
  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
    volumes:
      - model-cache:/cache
    restart: always
    networks:
      - default
    environment: *immich-env
volumes:
  nfs-data:
    driver: local
    driver_opts:
      type: nfs
      o: nfsvers=4,addr=10.10.10.12,rw,nolock,soft
      device: :/home/dietpi/localstack/data/immich_data
  model-cache:
    driver: local
    driver_opts:
      type: nfs
      o: nfsvers=4,addr=10.10.10.12,rw,nolock,soft
      device: :/home/dietpi/localstack/data/immich_model
networks:
  default: null
  network-layer:
    name: internal_bridge
    external: true
secrets:
  db_url:
    file: /home/dietpi/localstack/secrets/immich/db_url
  redis_password:
    file: /home/dietpi/localstack/secrets/immich/redis_password
