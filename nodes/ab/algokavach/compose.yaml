# Algokavach (github.com/ashishbhatiya18/algo-kavach): Delta Exchange strategy marketplace & runner.
# The web app is static on Cloudflare Pages (algokavach.pages.dev / algokavach.ab18.in) and calls
# api.algokavach.ab18.in directly: ab's tunnel (network stack) → Traefik → here.
# Data lives in node ab's local Postgres (database algokavach) on data-layer.
services:
  algokavach:
    image: ghcr.io/ashishbhatiya18/algo-kavach:latest
    container_name: algokavach
    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: always
    read_only: true
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://algokavach@postgres:5432/algokavach?sslmode=disable
      DATABASE_PASSWORD_FILE: /run/secrets/db_password
      MASTER_KEY_FILE: /run/secrets/master_key
      GOOGLE_CLIENT_ID: 814968473657-7b574enut0cl61euidma94lariu15s8d.apps.googleusercontent.com
      APP_ORIGIN: https://algokavach.pages.dev,https://algokavach.ab18.in
      ALLOWED_EMAILS: ashishbhatiya18@gmail.com
    secrets:
      - db_password
      - master_key
    networks:
      - network-layer
      - data-layer
    labels:
      - traefik.enable=true
      - traefik.docker.network=internal_bridge
      - traefik.http.routers.algokavach.rule=Host(`api.algokavach.ab18.in`)
      - traefik.http.services.algokavach.loadbalancer.server.port=8080

networks:
  network-layer:
    name: internal_bridge
    external: true
  data-layer:
    external: true

secrets:
  db_password:
    file: /home/dietpi/localstack/secrets/algokavach/db_password
  master_key:
    file: /home/dietpi/localstack/secrets/algokavach/master_key
