services:
  codeserver:
    image: lscr.io/linuxserver/code-server:4.145.2-ls376@sha256:29f84131fa023c006fcfea9afbf0a5f9959c1a0532cf865d8dc8dae69e3c4a17
    container_name: codeserver
    restart: always
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
      - DEFAULT_WORKSPACE=/repos
    volumes:
      - /home/dietpi/localstack/data/codeserver_config:/config
      - /home/dietpi/localstack/data/codeserver_claude:/config/.claude
      - /home/dietpi/repos:/repos
      - ./scripts/init-claude-code.sh:/custom-cont-init.d/init-claude-code.sh:ro
    networks:
      - network-layer
    labels:
      - traefik.enable=true
      - traefik.http.routers.code.rule=Host(`code.ab18.in`)
      - traefik.http.routers.code.middlewares=auth
      - traefik.http.services.code.loadbalancer.server.port=8443
networks:
  network-layer:
    name: internal_bridge
    external: true
