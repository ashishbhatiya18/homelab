services:
  codeserver:
    # Official image as dietpi, with the paths and flags the linuxserver image
    # used. scripts/start.sh installs Claude Code into /config/.local if missing.
    image: codercom/code-server:4.145.2@sha256:09565f9e07f5624554e295e8bab0e2fec4a7c533eb3cff459ed6596a4d3d7c1c
    container_name: codeserver
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    entrypoint: ["/start.sh"]
    restart: always
    environment:
      - TZ=Asia/Kolkata
      - HOME=/config
      - PATH=/config/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    volumes:
      - /home/dietpi/localstack/data/codeserver_config:/config
      - /home/dietpi/localstack/data/codeserver_claude:/config/.claude
      - /home/dietpi/repos:/repos
      - ./scripts/start.sh:/start.sh:ro
    networks:
      - network-layer
    labels:
      - traefik.enable=true
      - traefik.http.routers.code.rule=Host(`code.ab18.in`)
      - traefik.http.routers.code.middlewares=auth
      - traefik.http.services.code.loadbalancer.server.port=8443
networks:
  network-layer:
    name: internal_bridge
    external: true
