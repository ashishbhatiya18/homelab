# Node ab — read by nodes/<node>/node.sh (see the top of that file).

# network (traefik, cloudflared, tailscale) first: everything routes through
# it. data (postgres, redis) next: immich and others connect to it.
ORDER=(network data)

network internal_bridge bridge --subnet 11.11.11.0/24 --gateway 11.11.11.1
network data-layer bridge
