services:
  filebrowser:
    image: filebrowser/filebrowser:v2.63.23@sha256:a469ea076d4a1b4b1d86a41d130f2f536cd9da996a2b1fb39c0d7635f9d89b9a
    container_name: filebrowser
    networks:
      - network-layer
    restart: always
    labels:
      - traefik.enable=true
      - traefik.http.routers.filebrowser.rule=Host(`files.ab18.in`)
      - traefik.http.routers.filebrowser.middlewares=auth
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Asia/Kolkata
      FB_AUTH_HEADER: X-Auth-Request-User
      FB_AUTH_METHOD: proxy
    volumes:
      # Files and music only: never ~/localstack (it holds secrets/ and live
      # app state).
      - /home/dietpi/localstack/data/filebrowser_data/srv:/srv
      - /home/dietpi/music:/srv/music
      # Data persistence for FileBrowser settings/users
      - /home/dietpi/localstack/data/filebrowser_data:/database
      - ./config:/config

networks:
  network-layer:
    name: internal_bridge
    external: true
