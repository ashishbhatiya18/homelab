services:
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    networks:
      - network-layer
    restart: always
    labels:
      - traefik.enable=true
      - traefik.http.routers.filebrowser.rule=Host(`files.ab18.in`)
      - traefik.http.routers.filebrowser.middlewares=auth
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Asia/Kolkata
      FB_AUTH_HEADER: X-Auth-Request-User
      FB_AUTH_METHOD: proxy
    volumes:
      # This exposes your localstack directory to the app
      - /home/dietpi/localstack/data/filebrowser_data/srv:/srv
      - /home/dietpi/localstack:/srv/localstack
      - /home/dietpi/music:/srv/music
      # Data persistence for FileBrowser settings/users
      - /home/dietpi/localstack/data/filebrowser_data:/database
      - ./config:/config

networks:
  network-layer:
    name: internal_bridge
    external: true
