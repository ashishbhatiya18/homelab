<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Terminal</title>
<link rel="stylesheet" href="/vendor/xterm.css">
<link rel="stylesheet" href="/app.css">
</head>
<body>
  <div id="statusbar">
    <span id="status" class="disconnected">connecting&hellip;</span>
    <div id="toolbar">
      <button id="search-toggle" title="Search (Ctrl/Cmd+Shift+F)">Search</button>
      <button id="copy-screen" title="Copy visible screen to clipboard">Copy screen</button>
    </div>
  </div>
  <div id="search-bar" hidden>
    <input id="search-input" type="text" placeholder="Search scrollback&hellip;" autocomplete="off">
    <button id="search-prev" title="Previous match">&uarr;</button>
    <button id="search-next" title="Next match">&darr;</button>
    <button id="search-close" title="Close">&times;</button>
  </div>
  <div id="terminal"></div>

  <script src="/vendor/xterm.js"></script>
  <script src="/vendor/addon-fit.js"></script>
  <script src="/vendor/addon-clipboard.js"></script>
  <script src="/vendor/addon-web-links.js"></script>
  <script src="/vendor/addon-search.js"></script>
  <script src="/vendor/addon-unicode11.js"></script>
  <script src="/vendor/addon-webgl.js"></script>
  <script src="/vendor/addon-serialize.js"></script>
  <script src="/app.js"></script>
</body>
</html>
