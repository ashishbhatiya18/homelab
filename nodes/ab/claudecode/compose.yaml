services:
  claudecode:
    build:
      context: .
      dockerfile: Dockerfile
    image: claudecode:latest
    container_name: claudecode
    restart: always
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=Asia/Kolkata
      # Root filesystem is read-only, so the self-updater can't write to
      # ~/.local/bin — updates are handled by rebuilding the image instead.
      - DISABLE_AUTOUPDATER=1
    volumes:
      - /home/dietpi/localstack/data/claudecode_claude:/home/node/.claude
      # ~/.claude.json (session/conversation index, separate from ~/.claude/)
      # must also persist, or restarts reset the session even though
      # ~/.claude/ itself is retained. The host file must exist before the
      # container starts, or Docker will create a directory there instead.
      - /home/dietpi/localstack/data/claudecode_claude.json:/home/node/.claude.json
      - /home/dietpi/repos:/workspace
    networks:
      - network-layer
    labels:
      - traefik.enable=true
      - traefik.http.routers.term.rule=Host(`term.ab18.in`)
      - traefik.http.routers.term.middlewares=auth
      - traefik.http.services.term.loadbalancer.server.port=7681
networks:
  network-layer:
    name: internal_bridge
    external: true
