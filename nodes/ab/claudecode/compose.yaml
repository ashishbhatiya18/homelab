services:
  claudecode:
    # Built by .github/workflows/build-claudecode.yml from this directory
    # (private image: it contains the Claude Code binary).
    image: ghcr.io/ashishbhatiya18/claudecode:latest
    container_name: claudecode
    restart: always
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=Asia/Kolkata
      # Root filesystem is read-only, so the self-updater can't write to
      # ~/.local/bin — updates come from rebuilding the image instead
      # (Actions → Build claudecode → Run workflow, then pull on the node).
      - DISABLE_AUTOUPDATER=1
      # Makes claude-code write .claude.json inside the ~/.claude volume
      # below, instead of a separate top-level ~/.claude.json that would
      # sit outside the mount (and fail to write on the read-only rootfs).
      - CLAUDE_CONFIG_DIR=/home/node/.claude
      # Caps concurrent PTY sessions this server will spawn (defense-in-depth
      # behind the passkey gate). Raise if you regularly need more than this
      # many simultaneous terminal tabs/connections open at once.
      - MAX_CONCURRENT_SESSIONS=8
      # Public URL of the share viewer (served by this same container at
      # /share) — injected into each Claude session by the SessionStart hook.
      - SHARE_BASE_URL=https://term.ab18.in/share
    volumes:
      - /home/dietpi/localstack/data/claudecode_claude:/home/node/.claude
      - /home/dietpi/repos:/workspace
      # Documents Claude publishes per session, shown at term.ab18.in/share.
      # Create it owned by uid 1000 before first deploy, or Docker creates it
      # as root and the container can't write to it:
      #   mkdir -p /home/dietpi/localstack/data/claudecode_share && chown 1000:1000 $_
      - /home/dietpi/localstack/data/claudecode_share:/share
    networks:
      - network-layer
    labels:
      - traefik.enable=true
      - traefik.http.routers.term.rule=Host(`term.ab18.in`)
      - traefik.http.routers.term.middlewares=auth
      - traefik.http.services.term.loadbalancer.server.port=7681
networks:
  network-layer:
    name: internal_bridge
    external: true
