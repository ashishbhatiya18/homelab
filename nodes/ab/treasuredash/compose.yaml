# Treasure Dash – association treasury app (ghcr.io/ashishbhatiya18/treasure-dash).
# No login of its own: guarded by Authelia through the `auth` middleware.
# PostgreSQL: database/schema/role `treasuredash` on the data stack's postgres.
# Secrets (docs/secrets.md): secrets/treasuredash/database_url holds
#   postgres://treasuredash:<password>@postgres:5432/treasuredash?search_path=treasuredash&sslmode=disable
#   and reaches the app as DATABASE_URL_FILE.
# State: uploaded bills and snapshots in /home/dietpi/localstack/data/treasuredash
#   (owned by dietpi, 1000:1000). Root filesystem read-only; temp files in a tmpfs.
services:
  treasuredash:
    image: ghcr.io/ashishbhatiya18/treasure-dash:latest
    container_name: treasuredash
    restart: always
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    environment:
      TZ: Asia/Kolkata
      DATABASE_URL_FILE: /run/secrets/database_url
    secrets:
      - database_url
    volumes:
      - /home/dietpi/localstack/data/treasuredash:/data
    networks:
      - network-layer
      - data-layer
    healthcheck:
      test: ["CMD", "/app/treasuredash", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - traefik.enable=true
      - traefik.docker.network=internal_bridge
      - traefik.http.routers.treasuredash.rule=Host(`treasuredash.ab18.in`)
      - traefik.http.routers.treasuredash.middlewares=auth
      - traefik.http.services.treasuredash.loadbalancer.server.port=8080

secrets:
  database_url:
    file: /home/dietpi/localstack/secrets/treasuredash/database_url

networks:
  network-layer:
    name: internal_bridge
    external: true
  data-layer:
    external: true
