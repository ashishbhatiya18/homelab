services:
  excalidraw:
    # No version tags upstream (only latest and per-commit sha-*): pinned by digest alone.
    image: excalidraw/excalidraw@sha256:f7ee194addd607bf831d2af0f0a34463dd4225e426cf35199ef0b12a803398e9
    container_name: excalidraw
    # nginx: root master that switches its workers to nginx; just that.
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    restart: always
    stdin_open: true
    healthcheck:
      disable: true
    environment:
      NODE_ENV: production
    networks:
      - network-layer
    labels:
      - hardening.root=nginx master switches its workers to nginx; only CHOWN, SETUID, SETGID
      - traefik.enable=true
      - traefik.http.routers.draw.rule=Host(`draw.ab18.in`)
      - traefik.http.routers.draw.middlewares=auth
networks:
  network-layer:
    name: internal_bridge
    external: true