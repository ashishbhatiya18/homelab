services:
  excalidraw:
    image: excalidraw/excalidraw:latest@sha256:f7ee194addd607bf831d2af0f0a34463dd4225e426cf35199ef0b12a803398e9
    container_name: excalidraw
    restart: always
    stdin_open: true
    healthcheck:
      disable: true
    environment:
      NODE_ENV: production
    networks:
      - network-layer
    labels:
      - traefik.enable=true
      - traefik.http.routers.draw.rule=Host(`draw.ab18.in`)
      - traefik.http.routers.draw.middlewares=auth
networks:
  network-layer:
    name: internal_bridge
    external: true