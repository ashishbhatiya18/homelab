services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:12.4ubu2604-ls58@sha256:b7eabe1f098f4e850bfd63d6721369117195410a471db1a41748ab768b81a639
    container_name: jellyfin
    networks:
      - network-layer
    restart: always
    labels:
      - traefik.enable=true
      - traefik.http.routers.jelly.rule=Host(`jelly.ab18.in`)
      - traefik.http.services.jelly.loadbalancer.server.port=8096
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Asia/Kolkata
      UMASK_SET: "022"
    volumes:
      - /home/dietpi/movies:/data/movies
      - /home/dietpi/music:/data/music:ro
      - /home/dietpi/localstack/data/jellyfin_data/config:/config
      - /home/dietpi/localstack/data/jellyfin_data/cache:/cache
networks:
  network-layer:
    name: internal_bridge
    external: true
