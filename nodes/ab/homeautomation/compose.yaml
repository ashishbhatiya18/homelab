services:
  esphome:
    image: esphome/esphome:2026.11.0@sha256:35a22f23ba41e58ed1fa63627317d86f4eaba585e526e44f1118ab082cc96041
    container_name: esphome
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Read-only: builds go to /config/.esphome (PLATFORMIO_CORE_DIR below);
    # anything else that wants $HOME lands in the /tmp tmpfs.
    read_only: true
    tmpfs:
      - /tmp
    restart: always
    # dietpi, which owns data/esphome; never root. The image supports it: the
    # PlatformIO toolchains and build output stay under /config.
    user: "1000:1000"
    networks:
      - network-layer
    volumes:
      - /home/dietpi/localstack/data/esphome:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      ESPHOME_DASHBOARD_USE_PING: "true"
      PLATFORMIO_CORE_DIR: /config/.esphome/platformio
      HOME: /tmp
    labels:
      - traefik.enable=true
      - traefik.http.routers.esphome.rule=Host(`esphome.ab18.in`)
      - traefik.http.routers.esphome.middlewares=auth
networks:
  network-layer:
    name: internal_bridge
    external: true
