services:
  esphome:
    image: esphome/esphome
    container_name: esphome
    restart: always
    # dietpi, which owns data/esphome; never root. The image supports it: the
    # PlatformIO toolchains and build output stay under /config.
    user: "1000:1000"
    networks:
      - network-layer
    volumes:
      - /home/dietpi/localstack/data/esphome:/config
      - /etc/localtime:/etc/localtime:ro
    env_file: /home/dietpi/localstack/secrets/ab-homeautomation.env
    labels:
      - traefik.enable=true
      - traefik.http.routers.esphome.rule=Host(`esphome.ab18.in`)
      - traefik.http.routers.esphome.middlewares=auth
networks:
  network-layer:
    name: internal_bridge
    external: true
