services:
  watchtower:
    image: nickfedor/watchtower
    container_name: watchtower
    restart: always
    env_file: /home/dietpi/localstack/secrets/ab-localstack.env
    environment:
      # Detect new images but never apply them; updates are done with
      # `home stack update` / `home upgrade` (backup first, auto-rollback).
      - WATCHTOWER_MONITOR_ONLY=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      - com.centurylinklabs.watchtower.enable=false
  # Heartbeat (nodes/heartbeat.sh, copied here by the bundle): every 5 min it
  # pings Healthchecks.io — when pings stop (node, Docker, or the home's
  # internet/power down) Healthchecks.io alerts the fallback ntfy topic on
  # ntfy.sh — and pushes disk-space level changes of the host's / to ntfy.
  # secrets/ab-heartbeat.env: HC_PING_URL=https://hc-ping.com/<uuid>,
  #   NTFY_TOKEN=tk_… (write-only token for homelab*)
  heartbeat:
    image: curlimages/curl:latest
    container_name: heartbeat
    restart: always
    env_file: /home/dietpi/localstack/secrets/ab-heartbeat.env
    environment:
      NODE: ab
      NTFY_URL: http://ntfy/homelab
    # A fresh run each round, so a deployed edit applies without a restart.
    entrypoint: ["sh", "-c", "while true; do sh /heartbeat.sh; sleep 300; done"]
    volumes:
      - ./heartbeat.sh:/heartbeat.sh:ro
      - /:/host:ro
    networks:
      - network-layer
  # otel:
  #   image: grafana/otel-lgtm:latest
  #   container_name: otel
  #   volumes:
  #     - /home/dietpi/localstack/data/otel_data:/data
  #   restart: always
  #   networks:
  #     - network-layer
  #   labels:
  #     - traefik.enable=true
  #     - traefik.http.routers.otel.rule=Host(`otel.ab18.in`)
  #     - traefik.http.services.otel.loadbalancer.server.port=3000
networks:
  network-layer:
    name: internal_bridge
    external: true
