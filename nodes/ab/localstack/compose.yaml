services:
  # Heartbeat (nodes/heartbeat.sh, copied here by the bundle): every 5 min it
  # pings Healthchecks.io — when pings stop (node, Docker, or the home's
  # internet/power down) Healthchecks.io alerts the fallback ntfy topic on
  # ntfy.sh — and pushes disk-space level changes of the host's / to ntfy.
  # secrets/localstack/hc_ping_url: https://hc-ping.com/<uuid> (no ntfy token on
  # ab yet: disk alerts are log-only). Runs as dietpi, who owns the secret.
  heartbeat:
    image: curlimages/curl:latest@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
    container_name: heartbeat
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    restart: always
    user: "1000:1000"
    environment:
      NODE: ab
      NTFY_URL: http://ntfy/homelab
      HC_PING_URL_FILE: /run/secrets/hc_ping_url
    secrets:
      - hc_ping_url
    # A fresh run each round, so a deployed edit applies without a restart.
    entrypoint: ["sh", "-c", "while true; do sh /heartbeat.sh; sleep 300; done"]
    volumes:
      - ./heartbeat.sh:/heartbeat.sh:ro
      # One file on the root filesystem is enough for `df /host`; mounting all
      # of / would let it read every secret (uid 1000 owns them).
      - /etc/hostname:/host:ro
    networks:
      - network-layer
  # otel:
  #   image: grafana/otel-lgtm:latest
  #   container_name: otel
  #   volumes:
  #     - /home/dietpi/localstack/data/otel_data:/data
  #   restart: always
  #   networks:
  #     - network-layer
  #   labels:
  #     - traefik.enable=true
  #     - traefik.http.routers.otel.rule=Host(`otel.ab18.in`)
  #     - traefik.http.services.otel.loadbalancer.server.port=3000
networks:
  network-layer:
    name: internal_bridge
    external: true
secrets:
  hc_ping_url:
    file: /home/dietpi/localstack/secrets/localstack/hc_ping_url
