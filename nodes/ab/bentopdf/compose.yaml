services:
  bentopdf:
    # Static nginx app: PDFs are processed in the browser, never on the server.
    # -simple: the self-hosted build, every tool without the marketing pages.
    image: bentopdfteam/bentopdf-simple:v2.8.11@sha256:3bbab98791694b77bc70ab03bf1b2ea89e568a75ef172c27d95cbdbdf810038f
    container_name: bentopdf
    networks:
      - network-layer
    restart: always
    read_only: true
    tmpfs:
      - /tmp:mode=1777
      - /etc/nginx/tmp:mode=1777
      - /var/cache/nginx:mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    labels:
      - traefik.enable=true
      - traefik.http.routers.pdf.rule=Host(`pdf.ab18.in`)
      - traefik.http.routers.pdf.middlewares=auth
      - traefik.http.services.pdf.loadbalancer.server.port=8080
networks:
  network-layer:
    name: internal_bridge
    external: true
