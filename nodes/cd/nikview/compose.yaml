# Nikview (github.com/ashishbhatiya18/nikview.com): the admin apps for Costa È Bella and Citrus Dental.
# The web app is static on Cloudflare Pages (nikview.com) and calls
# api.nikview.com directly, which the nikview.com tunnel (this stack's cloudflared, on
# internal_bridge) routes here. Data lives in node ab's shared Postgres (database nikview),
# set up once with deploy/shared-postgres-bootstrap.sql in the nikview repo.
# CLI: docker exec nikview nikview tenant list
services:
  nikview:
    # Pinned; nikview's CI re-pins it after each build (.github/workflows/image-bump.yml).
    image: ghcr.io/ashishbhatiya18/nikview.com:sha-29d9f11@sha256:ac6cd35aab5854f3cdfe42aa784d74a9ee034decb3150bdfebbbe384efebf7d4
    container_name: nikview
    restart: always
    read_only: true
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://nikview_app@pg.ab18.in:443/nikview?sslmode=require
      DATABASE_PASSWORD_FILE: /run/secrets/db_app_password
      DATABASE_OWNER_URL: postgres://nikview@pg.ab18.in:443/nikview?sslmode=require
      DATABASE_OWNER_PASSWORD_FILE: /run/secrets/db_owner_password
      # Public OAuth client id; its JavaScript origins are https://nikview.com and http://localhost:3000.
      GOOGLE_CLIENT_ID: 814968473657-7b574enut0cl61euidma94lariu15s8d.apps.googleusercontent.com
      # The web app's origin: CORS allows it (with the cookie), passkeys are checked against it.
      APP_ORIGIN: https://nikview.com
      PASSKEY_RP_ID: nikview.com
      # Costa È Bella website's Cloudflare Pages deploy hook: nikview rebuilds the site after menu changes.
      MENU_PUBLISH_HOOK_COSTAEBELLA_FILE: /run/secrets/menu_publish_hook_costaebella
    secrets:
      - db_app_password
      - db_owner_password
      - menu_publish_hook_costaebella
    networks:
      - internal_bridge
    extra_hosts:
      - "pg.ab18.in:10.10.10.11"
  # The nikview.com tunnel (cloud/tunnels/nikview.com.yaml): api.nikview.com → nikview:8080.
  cloudflared:
    image: cloudflare/cloudflared:latest@sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba
    command: tunnel --no-autoupdate run
    container_name: nikview-cloudflare
    restart: always
    networks:
      - internal_bridge
    # The token is a secret file, owned by cloudflared's user (65532), mode
    # 600; `home tunnel token nikview.com --install` writes it.
    environment:
      - TUNNEL_TOKEN_FILE=/run/secrets/cloudflare_tunnel_token
    secrets:
      - cloudflare_tunnel_token

networks:
  internal_bridge:
    external: true

secrets:
  db_app_password:
    file: /home/dietpi/localstack/secrets/nikview/db_app_password
  db_owner_password:
    file: /home/dietpi/localstack/secrets/nikview/db_owner_password
  menu_publish_hook_costaebella:
    file: /home/dietpi/localstack/secrets/nikview/menu_publish_hook_costaebella
  cloudflare_tunnel_token:
    file: /home/dietpi/localstack/secrets/nikview/cloudflare_tunnel_token
