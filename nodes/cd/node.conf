# Node cd — read by nodes/<node>/node.sh (see the top of that file).

# network (traefik, pihole, tailscale) first: everything routes through it.
ORDER=(network)

network internal_bridge bridge --subnet 11.11.11.0/24 --gateway 11.11.11.1
# Pi-hole's LAN address (10.10.10.10) on eth0.
network pihole_macvlan macvlan --subnet 10.10.10.0/24 --gateway 10.10.10.1 --ip-range 10.10.10.10/32 -o parent=eth0
