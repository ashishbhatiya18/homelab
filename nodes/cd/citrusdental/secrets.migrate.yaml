# One-time move into the layout of docs/secrets.md, applied by
# `home secret migrate dietpi/citrusdental`; delete this file afterwards.
# Needs the api and peripheral images that read X_FILE (citrusdental
# nonroot-and-secret-files) to be published first.
- from: api/env
  key: SECRET_KEY
  to: api/secret_key
- from: api/env
  key: DATABASE_URL
  to: api/database_url
- from: api/env
  key: OPENAI_API_KEY
  to: api/openai_api_key
- from: peripheral/env
  key: GOOGLE_API_KEY
  to: peripheral/google_api_key
- from: peripheral/slack/token.txt
  to: peripheral/slack_access_token
- from: cloudflare_tunnel_token
  to: citrusdental/cloudflare_tunnel_token
