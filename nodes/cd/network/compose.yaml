services:
  traefik:
    image: traefik:v3.7.17@sha256:f4bb143d1135a579b630ed491e17ec50f6f7c9c6a30585ff3d385471d2a86f5a
    container_name: traefik
    restart: always
    networks:
      - internal_bridge
      - socket
    ports:
      - 80:80
      - 443:443
      - "443:443/udp"
    volumes:
      - ./config/traefik/traefik.yml:/etc/traefik/traefik.yml
      - ./config/traefik/traefik_dynamic.yml:/etc/traefik/traefik_dynamic.yaml
      - /home/dietpi/localstack/data/traefik/acme.json:/etc/acme/acme.json
    environment:
      - CF_DNS_API_TOKEN_FILE=/run/secrets/cf_dns_api_token
    labels:
      - traefik.enable=true
      - traefik.http.routers.proxy.rule=Host(`proxy.citrusdental.in`)
      - traefik.http.routers.proxy.entrypoints=websecure
      - traefik.http.routers.proxy.tls=true
      - traefik.http.routers.proxy.service=api@internal
      - com.centurylinklabs.watchtower.enable=false
    secrets:
      - cf_dns_api_token

  # Read-only Docker API for Traefik (containers, events, version): Traefik
  # never holds the socket itself. Only Traefik shares its network.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    container_name: socket-proxy
    restart: always
    read_only: true
    tmpfs:
      - /run
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - CONTAINERS=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket

  tailscale:
    image: tailscale/tailscale:latest@sha256:ed6480b33c6eb67c9cbd203ed42b9fb57e361986725b6856def71b7a3d9e276c
    container_name: tailscale
    hostname: cd-node
    restart: always
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    volumes:
      - tailscale_state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    entrypoint: ["/bin/sh", "-c", "export TS_AUTHKEY=$(cat /run/secrets/ts_auth_key) && exec /usr/local/bin/containerboot"]
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_ACCEPT_DNS=false
      - TS_AUTH_ONCE=true
      # No SNAT for traffic forwarded from tailscale0 (as on ab): Traefik must
      # see the client's Tailscale IP. cd advertises no routes. Tailscale sets
      # no netfilter rules on this kernel today; this keeps it so if it does.
      - TS_EXTRA_ARGS=--snat-subnet-routes=false
    secrets:
      - ts_auth_key
    labels:
      - com.centurylinklabs.watchtower.enable=false

  dnsdist:
    image: powerdns/dnsdist-19@sha256:260b1120947a10c494fad4d93cde33ebace34bf4800c88ebb114dd7f9e829809
    container_name: dnsdist
    restart: always
    network_mode: host
    user: root
    cap_add:
      - NET_BIND_SERVICE
    labels:
      - com.centurylinklabs.watchtower.enable=false
    volumes:
      - ./config/dnsdist/dnsdist.conf:/etc/dnsdist/dnsdist.conf:ro
    depends_on:
      blocky:
        condition: service_healthy
  # Ad blocking, cache and upstream behind dnsdist, the LAN's and Tailscale's
  # DNS server (10.10.10.12, handed out by the router).
  blocky:
    image: spx01/blocky:v0.35.0@sha256:4f165b63db0d76c96ecc47c7a8f57caeedc003a912bdce29abb0e283ce02e16b
    container_name: blocky
    restart: always
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/app/blocky", "healthcheck", "--port", "5353"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - com.centurylinklabs.watchtower.enable=false
      - traefik.enable=false
    networks:
      - internal_bridge
    ports:
      - "127.0.0.1:5354:5353/udp"
      - "127.0.0.1:5354:5353/tcp"
    volumes:
      - ./config/blocky/config.yml:/app/config.yml:ro
volumes:
  tailscale_state:

networks:
  # Traefik ↔ socket-proxy only; internal: no route out.
  socket:
    internal: true
  internal_bridge:
    name: internal_bridge
    external: true
# Secret files (docs/secrets.md), mounted at /run/secrets/<name>.
secrets:
  cf_dns_api_token:
    file: /home/dietpi/localstack/secrets/network/cf_dns_api_token
  ts_auth_key:
    file: /home/dietpi/localstack/secrets/network/ts_auth_key
