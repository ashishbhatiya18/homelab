services:
  traefik:
    image: traefik:latest
    container_name: traefik
    restart: always
    networks:
      - internal_bridge
    ports:
      - 80:80
      - 443:443
      - "443:443/udp"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config/traefik/traefik.yml:/etc/traefik/traefik.yml
      - ./config/traefik/traefik_dynamic.yml:/etc/traefik/traefik_dynamic.yaml
      - /home/dietpi/localstack/data/traefik/acme.json:/etc/acme/acme.json
    environment:
      - CF_DNS_API_TOKEN_FILE=/run/secrets/cf_dns_api_token
    labels:
      - traefik.enable=true
      - traefik.http.routers.proxy.rule=Host(`proxy.citrusdental.in`)
      - traefik.http.routers.proxy.entrypoints=websecure
      - traefik.http.routers.proxy.tls=true
      - traefik.http.routers.proxy.service=api@internal
      - com.centurylinklabs.watchtower.enable=false
    secrets:
      - cf_dns_api_token

  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    hostname: cd-node
    restart: always
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    volumes:
      - tailscale_state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    entrypoint: ["/bin/sh", "-c", "export TS_AUTHKEY=$(cat /run/secrets/ts_auth_key) && exec /usr/local/bin/containerboot"]
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_ACCEPT_DNS=false
      - TS_AUTH_ONCE=true
      # No SNAT for traffic forwarded from tailscale0 (as on ab): Traefik must
      # see the client's Tailscale IP. cd advertises no routes. Tailscale sets
      # no netfilter rules on this kernel today; this keeps it so if it does.
      - TS_EXTRA_ARGS=--snat-subnet-routes=false
    secrets:
      - ts_auth_key
    labels:
      - com.centurylinklabs.watchtower.enable=false

  dnsdist:
    image: powerdns/dnsdist-19
    container_name: dnsdist
    restart: always
    network_mode: host
    user: root
    cap_add:
      - NET_BIND_SERVICE
    labels:
      - com.centurylinklabs.watchtower.enable=false
    volumes:
      - ./config/dnsdist/dnsdist.conf:/etc/dnsdist/dnsdist.conf:ro
    depends_on:
      blocky:
        condition: service_healthy
  # Ad blocking, cache and upstream behind dnsdist, the LAN's and Tailscale's
  # DNS server (10.10.10.12, handed out by the router).
  blocky:
    image: spx01/blocky:v0.35.0@sha256:4f165b63db0d76c96ecc47c7a8f57caeedc003a912bdce29abb0e283ce02e16b
    container_name: blocky
    restart: always
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/app/blocky", "healthcheck", "--port", "5353"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - com.centurylinklabs.watchtower.enable=false
      - traefik.enable=false
    networks:
      - internal_bridge
    ports:
      - "127.0.0.1:5354:5353/udp"
      - "127.0.0.1:5354:5353/tcp"
    volumes:
      - ./config/blocky/config.yml:/app/config.yml:ro
volumes:
  tailscale_state:

networks:
  internal_bridge:
    name: internal_bridge
    external: true
# Secret files (docs/secrets.md), mounted at /run/secrets/<name>.
secrets:
  cf_dns_api_token:
    file: /home/dietpi/localstack/secrets/network/cf_dns_api_token
  ts_auth_key:
    file: /home/dietpi/localstack/secrets/network/ts_auth_key
