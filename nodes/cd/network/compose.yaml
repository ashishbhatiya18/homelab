services:
  traefik:
    image: traefik:v3.8.0@sha256:00c9734983e74ae35a1fc18eaee9e9da13f3dde95c4e45b3b8c3b60e0dbd2d17
    container_name: traefik
    # dietpi, which owns acme.json and the DNS token; binds 80/443 through the
    # namespaced sysctl instead of a capability.
    user: "1000:1000"
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: always
    networks:
      - internal_bridge
      - socket
    ports:
      - 80:80
      - 443:443
      - "443:443/udp"
    volumes:
      - ./config/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./config/traefik/traefik_dynamic.yml:/etc/traefik/traefik_dynamic.yaml:ro
      - /home/dietpi/localstack/data/traefik/acme.json:/etc/acme/acme.json
    environment:
      - CF_DNS_API_TOKEN_FILE=/run/secrets/cf_dns_api_token
    labels:
      - traefik.enable=true
      - traefik.http.routers.proxy.rule=Host(`proxy.citrusdental.in`)
      - traefik.http.routers.proxy.entrypoints=websecure
      - traefik.http.routers.proxy.tls=true
      - traefik.http.routers.proxy.service=api@internal
      - com.centurylinklabs.watchtower.enable=false
    secrets:
      - cf_dns_api_token

  # The node's Cloudflare tunnel (cd-localstack, cloud/tunnels/cd-localstack.yaml):
  # every public hostname on cd → Traefik. The token is a secret file owned by
  # cloudflared's user (65532); `home tunnel token cd-localstack --install` writes it.
  cloudflared:
    image: cloudflare/cloudflared:2026.11.2@sha256:55c7e3e8d89d5e8d20b75a82f3602cbf98e06db406e73e282073cfdc5a9a3af6
    container_name: cloudflared
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    restart: always
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN_FILE=/run/secrets/cloudflared_tunnel_token
    secrets:
      - cloudflared_tunnel_token
    networks:
      internal_bridge:
        # Fixed so Traefik can trust exactly this hop's X-Forwarded-For
        # (the real client IP from Cloudflare); see traefik.yml.
        ipv4_address: 11.11.11.251
  # CrowdSec agent: reads Traefik's log through socket-proxy and sends alerts to
  # ab's CrowdSec (crowdsec.ab18.in, machine cd), which decides, notifies ntfy
  # and later feeds the bouncers. No local API, so no notification plugins.
  # State: data/crowdsec/ (Docker creates it, root-owned).
  crowdsec:
    image: crowdsecurity/crowdsec:v1.8.2@sha256:65b74942f7e7ed5c60fde4ac15fc4ba715904c398c8b16dd451f4907d90347d4
    container_name: crowdsec
    restart: always
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    entrypoint: ["/bin/bash", "-c", "export AGENT_PASSWORD=$(cat /run/secrets/agent_password) && exec /bin/bash /docker_start.sh"]
    environment:
      - DISABLE_LOCAL_API=true
      - LOCAL_API_URL=https://crowdsec.ab18.in
      - AGENT_USERNAME=cd
      - COLLECTIONS=crowdsecurity/traefik
      # Hub upgrades would write through the image's read-only data links;
      # scenarios and parsers update with the image (Dependabot) instead.
      - NO_HUB_UPGRADE=true
    volumes:
      - /home/dietpi/localstack/data/crowdsec/config:/etc/crowdsec
      - /home/dietpi/localstack/data/crowdsec/data:/var/lib/crowdsec/data
      - ./config/crowdsec/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      - ./config/crowdsec/whitelist.yaml:/etc/crowdsec/parsers/s02-enrich/homelab-whitelist.yaml:ro
    secrets:
      - source: crowdsec_agent_password
        target: agent_password
    extra_hosts:
      - "crowdsec.ab18.in:10.10.10.11"
    healthcheck:
      test: ["CMD", "cscli", "lapi", "status"]
      interval: 30s
      timeout: 10s
      start_period: 120s
    networks:
      - socket          # logs, through socket-proxy
      - internal_bridge # ab's CrowdSec, the hub
    labels:
      - hardening.root=the image's default config is root-only; runs without capabilities
  # Read-only Docker API for Traefik (containers, events, version) and CrowdSec
  # (container logs, info): neither holds the socket itself. Only they share
  # its network.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    container_name: socket-proxy
    labels:
      - hardening.root=haproxy reads the Docker socket; read-only, no capabilities
      - hardening.host-access=docker.sock, as a read-only API for Traefik only
    restart: always
    read_only: true
    tmpfs:
      - /run
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - CONTAINERS=1
      - INFO=1 # CrowdSec's docker log source checks /info first
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket

  tailscale:
    image: tailscale/tailscale:v1.104.7@sha256:72c1e19e0aedca96b8533bbb0b4368564410ff20b17e53b804eb6c1f04a31be4
    container_name: tailscale
    hostname: cd-node
    restart: always
    network_mode: host
    # tun is loaded at boot (/etc/modules-load.d/tun.conf), so no SYS_MODULE.
    cap_add:
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    # Read-only: sockets in /tmp and /run/tailscale, the iptables lock in /run;
    # state is the tailscale_state volume.
    read_only: true
    tmpfs:
      - /tmp
      - /run
    volumes:
      - tailscale_state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    entrypoint: ["/bin/sh", "-c", "export TS_AUTHKEY=$(cat /run/secrets/ts_auth_key) && exec /usr/local/bin/containerboot"]
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_ACCEPT_DNS=false
      - TS_AUTH_ONCE=true
      # No SNAT for traffic forwarded from tailscale0 (as on ab): Traefik must
      # see the client's Tailscale IP. cd advertises no routes. Tailscale sets
      # no netfilter rules on this kernel today; this keeps it so if it does.
      - TS_EXTRA_ARGS=--snat-subnet-routes=false
    secrets:
      - ts_auth_key
    labels:
      - hardening.root=tailscaled manages the tun device
      - hardening.host-access=host network, for the node's own tailnet address
      - hardening.caps=NET_ADMIN plus Docker's defaults
      - com.centurylinklabs.watchtower.enable=false

  dnsdist:
    image: powerdns/dnsdist-19:1.9.16@sha256:260b1120947a10c494fad4d93cde33ebace34bf4800c88ebb114dd7f9e829809
    container_name: dnsdist
    restart: always
    network_mode: host
    # Root only to bind :53 on the host; dnsdist then drops to pdns.
    user: root
    command: ["--uid", "pdns", "--gid", "pdns"]
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    labels:
      - hardening.root=binds :53 on the host, then runs as pdns
      - hardening.host-access=host network, to serve DNS on the node's own LAN and Tailscale addresses
      - com.centurylinklabs.watchtower.enable=false
    volumes:
      - ./config/dnsdist/dnsdist.conf:/etc/dnsdist/dnsdist.conf:ro
    depends_on:
      blocky:
        condition: service_healthy
  # Ad blocking, cache and upstream behind dnsdist, the LAN's and Tailscale's
  # DNS server (10.10.10.12, handed out by the router).
  blocky:
    image: spx01/blocky:v0.36.0@sha256:191c0f1e688aa37698297ef4059e11a2b080299a878f5b31d6d32ace9d0c54b2
    container_name: blocky
    user: "100:0"
    restart: always
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/app/blocky", "healthcheck", "--port", "5353"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - com.centurylinklabs.watchtower.enable=false
      - traefik.enable=false
    networks:
      - internal_bridge
    ports:
      - "127.0.0.1:5354:5353/udp"
      - "127.0.0.1:5354:5353/tcp"
    volumes:
      - ./config/blocky/config.yml:/app/config.yml:ro
volumes:
  tailscale_state:

networks:
  # Traefik and CrowdSec ↔ socket-proxy only; internal: no route out.
  socket:
    internal: true
  internal_bridge:
    name: internal_bridge
    external: true
# Secret files (docs/secrets.md), mounted at /run/secrets/<name>.
secrets:
  cf_dns_api_token:
    file: /home/dietpi/localstack/secrets/network/cf_dns_api_token
  ts_auth_key:
    file: /home/dietpi/localstack/secrets/network/ts_auth_key
  cloudflared_tunnel_token:
    file: /home/dietpi/localstack/secrets/network/cloudflared_tunnel_token
  crowdsec_agent_password:
    file: /home/dietpi/localstack/secrets/network/crowdsec_agent_password
