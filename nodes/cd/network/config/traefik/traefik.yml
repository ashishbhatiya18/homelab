entryPoints:
  websecure:
    address: :443
    forwardedHeaders:
      trustedIPs:
        # cloudflared (fixed IP in compose.yaml): tunnel traffic comes from it
        - 11.11.11.251/32
    http3:
      advertisedPort: 443
    asDefault: true
    http:
      tls:
        certResolver: myresolver
  web:
    address: :80
    forwardedHeaders:
      trustedIPs:
        # cloudflared (fixed IP in compose.yaml): tunnel traffic comes from it
        - 11.11.11.251/32
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https

ping:
  manualRouting: true

providers:
  docker:
    # Read-only Docker API through socket-proxy (network stack), not the socket.
    endpoint: tcp://socket-proxy:2375
    exposedByDefault: false
    network: internal_bridge
  file:
    filename: /etc/traefik/traefik_dynamic.yaml

api:
  dashboard: true
log:
  level: INFO
# To stdout: CrowdSec reads it through socket-proxy.
accesslog: {}

certificatesResolvers:
  myresolver:
    acme:
      storage: "/etc/acme/acme.json"
      dnsChallenge:
        provider: cloudflare
        resolvers:
          - "1.1.1.1:53"
          - "8.8.8.8:53"

