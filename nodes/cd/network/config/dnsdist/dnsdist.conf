-- Listen on all interfaces (UDP + TCP) — binds to LAN, Tailscale, and loopback
setLocal("0.0.0.0:53")
-- Only the LAN, Tailscale and loopback may query; not Docker bridges or anyone else.
setACL({"10.10.0.0/16", "100.64.0.0/10", "127.0.0.0/8"})

-- Blocky (ad blocking, cache, 1.1.1.1 upstream) on localhost port 5354 (default pool)
newServer({address="127.0.0.1:5354", name="blocky"})

-- External resolver — public answers for the apex domains and for
-- citrusdental.in names that are not node cd's own services
newServer({address="1.1.1.1:53", name="external", pool="external"})

local ts_nets = newNMG()
ts_nets:addMask("100.64.0.0/10")
local lan_nets = newNMG()
lan_nets:addMask("10.10.10.0/24")

-- Apex domains → 1.1.1.1 directly for all clients (Pages, MX)
addAction(QNameRule("ab18.in."), PoolAction("external"))
addAction(QNameRule("citrusdental.in."), PoolAction("external"))

-- Answer names under `names` with one IPv4 for clients in `nets`; any other
-- qtype (AAAA, HTTPS/SVCB…) gets an empty answer, so it never falls through to
-- the public CNAME → apex → Cloudflare's addresses/hints.
-- No AAAA: the Docker networks are IPv4-only, so IPv6 connections go through
-- docker-proxy and reach Traefik from the bridge gateway, losing the client IP.
local function pin(nets, names, ip)
  addAction(AndRule({NetmaskGroupRule(nets), SuffixMatchNodeRule(names)}), SpoofAction({ip}))
  addAction(AndRule({NetmaskGroupRule(nets), SuffixMatchNodeRule(names)}), RCodeAction(DNSRCode.NOERROR))
end

-- Every ab18.in subdomain → node ab
local smn_ab18 = newSuffixMatchNode()
smn_ab18:add("ab18.in.")
pin(ts_nets, smn_ab18, "100.108.211.112")
pin(lan_nets, smn_ab18, "10.10.10.11")

-- citrusdental.in: only node cd's own services (allowlist) → node cd.
-- Everything else — www/admin/smiledesign on Pages, api via the tunnel, mail —
-- resolves publicly.
local smn_cd = newSuffixMatchNode()
for _, n in ipairs({"smiledesign-be", "proxy", "watchtower", "docker"}) do
  smn_cd:add(n .. ".citrusdental.in.")
end
pin(ts_nets, smn_cd, "100.116.167.96")
pin(lan_nets, smn_cd, "10.10.10.12")
local smn_cd_all = newSuffixMatchNode()
smn_cd_all:add("citrusdental.in.")
addAction(SuffixMatchNodeRule(smn_cd_all), PoolAction("external"))

-- Everything else → Blocky
addAction(AllRule(), PoolAction(""))
