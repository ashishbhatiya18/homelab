# Blocky: ad blocking, caching and forwarding behind dnsdist (port 5353).
# Split-horizon answers for ab18.in / citrusdental.in live in dnsdist.conf.
upstreams:
  groups:
    default:
      - 1.1.1.1
blocking:
  denylists:
    ads:
      - https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
  clientGroupsBlock:
    default:
      - ads
  blockType: zeroIp
caching:
  prefetching: true
ports:
  dns: 5353
log:
  level: warn
