services:
  api:
    image: ghcr.io/ashishbhatiya18/costaebella-backend:latest
    container_name: costaebella-be
    restart: always
    environment:
      PORT: "8080"
      ALLOWED_ORIGINS: https://costaebella.pages.dev
      GOOGLE_CLIENT_ID: 719888124802-ap7f2ldmvj76791i944k7e47dv7dhin1.apps.googleusercontent.com
      ADMIN_EMAIL: ashishbhatiya18@gmail.com
      DATABASE_URL: postgres://shiftly@pg.ab18.in:443/shiftly
      DATABASE_PASSWORD_FILE: /run/secrets/database_password
      JWT_SECRET_FILE: /run/secrets/jwt_secret
    secrets:
      - database_password
      - jwt_secret
    networks:
      - internal_bridge
      - native
    extra_hosts:
      - "pg.ab18.in:10.10.10.11"
  cloudflared:
    command: tunnel --no-autoupdate run
    image: cloudflare/cloudflared:latest
    container_name: costaebella-cloudflare
    restart: always
    networks:
      - internal_bridge
      - native
    # The token is a secret file, owned by cloudflared's user (65532), mode
    # 600; `home tunnel token nikview.com --install` writes it
    # (cloud/tunnels/nikview.com.yaml).
    environment:
      - TUNNEL_TOKEN_FILE=/run/secrets/cloudflare_tunnel_token
    secrets:
      - cloudflare_tunnel_token

networks:
  native: {}
  internal_bridge:
    external: true

secrets:
  database_password:
    file: /home/dietpi/localstack/secrets/costaebella/database_password
  jwt_secret:
    file: /home/dietpi/localstack/secrets/costaebella/jwt_secret
  cloudflare_tunnel_token:
    file: /home/dietpi/localstack/secrets/costaebella/cloudflare_tunnel_token
