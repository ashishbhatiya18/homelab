# One-time move into the layout of docs/secrets.md, applied by
# `home secret migrate dietpi/costaebella`; delete this file afterwards.
# costaebella/database_password is created by hand on the node beforehand
# (the password is split out of the old DATABASE_URL, which this format
# can't do); the other values of costaebella/env are plain config, now in
# compose.yaml.
- from: costaebella/env
  key: JWT_SECRET
  to: costaebella/jwt_secret
- from: costaebella_cloudflare_tunnel_token
  to: costaebella/cloudflare_tunnel_token
