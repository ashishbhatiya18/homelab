services:
  watchtower:
    image: nickfedor/watchtower
    container_name: watchtower
    restart: always
    # WATCHTOWER_HTTP_API_TOKEN (secrets, not the repo)
    env_file: /home/dietpi/localstack/secrets/cd-watchtower.env
    environment:
      - WATCHTOWER_UPDATE_ON_START=true
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_HTTP_API_METRICS=true
      # Detect new images but never apply them; updates are done with
      # `home stack update` / `home upgrade` (backup first, auto-rollback).
      - WATCHTOWER_MONITOR_ONLY=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
        - internal_bridge
    labels:
      - com.centurylinklabs.watchtower.enable=false
      - traefik.enable=true
      - traefik.http.routers.watchtower.rule=Host(`watchtower.citrusdental.in`)
      - traefik.http.services.watchtower.loadbalancer.port=8080
  # Heartbeat for Healthchecks.io: pings every 5 min; when pings stop (node,
  # Docker or the internet down — incl. power cuts that take out both nodes),
  # Healthchecks.io alerts the fallback ntfy topic on ntfy.sh.
  # HC_PING_URL=https://hc-ping.com/<uuid> in secrets/cd-heartbeat.env
  heartbeat:
    image: curlimages/curl:latest
    container_name: heartbeat
    restart: always
    env_file: /home/dietpi/localstack/secrets/cd-heartbeat.env
    entrypoint: ["sh", "-c"]
    command:
      - while true; do curl -fsS -m 10 --retry 3 -o /dev/null "$$HC_PING_URL" || echo "ping failed"; sleep 300; done
    networks:
      - internal_bridge
networks:
  internal_bridge:
    external: true
