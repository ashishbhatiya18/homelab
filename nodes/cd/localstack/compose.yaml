services:
  watchtower:
    image: nickfedor/watchtower
    container_name: watchtower
    restart: always
    # WATCHTOWER_HTTP_API_TOKEN (secrets, not the repo)
    env_file: /home/dietpi/localstack/secrets/cd-watchtower.env
    environment:
      - WATCHTOWER_UPDATE_ON_START=true
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_HTTP_API_METRICS=true
      # Detect new images but never apply them; updates are done with
      # `home stack update` / `home upgrade` (backup first, auto-rollback).
      - WATCHTOWER_MONITOR_ONLY=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
        - internal_bridge
    labels:
      - com.centurylinklabs.watchtower.enable=false
      - traefik.enable=true
      - traefik.http.routers.watchtower.rule=Host(`watchtower.citrusdental.in`)
      - traefik.http.services.watchtower.loadbalancer.port=8080
  # Heartbeat (nodes/heartbeat.sh, copied here by the bundle): every 5 min it
  # pings Healthchecks.io — when pings stop (node, Docker, or the home's
  # internet/power down) Healthchecks.io alerts the fallback ntfy topic on
  # ntfy.sh — and pushes disk-space level changes of the host's / to ntfy.
  # secrets/cd-heartbeat.env: HC_PING_URL=https://hc-ping.com/<uuid>,
  #   NTFY_TOKEN=tk_… (write-only token for homelab*)
  heartbeat:
    image: curlimages/curl:latest
    container_name: heartbeat
    restart: always
    env_file: /home/dietpi/localstack/secrets/cd-heartbeat.env
    environment:
      NODE: cd
      NTFY_URL: https://ntfy-lan.ab18.in/homelab
    # A fresh run each round, so a deployed edit applies without a restart.
    entrypoint: ["sh", "-c", "while true; do sh /heartbeat.sh; sleep 300; done"]
    volumes:
      - ./heartbeat.sh:/heartbeat.sh:ro
      - /:/host:ro
    # ntfy on ab over the LAN (its LAN-only alias, see nodes/ab/ntfy).
    extra_hosts:
      - ntfy-lan.ab18.in:10.10.10.11
    networks:
      - internal_bridge
networks:
  internal_bridge:
    external: true
